events {
    # Event directives...
}

http {
	server {
    listen 80;
    server_name kalinga.priyanshuu.xyz;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
	}
}

sudo apt install certbot python3-certbot-nginx // install certbox on server 
sudo certbot --nginx  // setup certificates 
sudo certbot renew --dry-run // issue a bot
